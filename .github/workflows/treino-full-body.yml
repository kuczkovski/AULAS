name: Treino Full Body

on:
  pull_request:
    paths:
      - "treino-full-body/**"
      - ".github/workflows/treino-full-body.yml"
      - ".github/pages/**"
  push:
    paths:
      - "treino-full-body/**"
      - "fracoes/**"
      - ".github/workflows/treino-full-body.yml"
      - ".github/pages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treino-full-body
    env:
      # Publicado em https://<usuário>.github.io/<repositório>/treino/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/treino
      # Opcional: defina em Settings → Secrets and variables → Actions → Variables
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: treino-full-body/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Montar o site (aulas + app)
        working-directory: .
        run: |
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          cp -r fracoes _site/fracoes
          cp -r treino-full-body/out _site/treino
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    # Publica somente a partir da branch padrão do repositório.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}treino/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
