<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aulas</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --ink: #111; --muted: #555; --card: #fff; --line: #ddd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0c0f; --ink: #f4f6f8; --muted: #a9b2bf; --card: #14171c; --line: #313843; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 2rem 1rem; }
    a { display: block; margin-top: 1rem; padding: 1rem 1.25rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--card); color: inherit; text-decoration: none; }
    a strong { display: block; font-size: 1.1rem; }
    a span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Aulas</h1>
    <a href="treino/"><strong>Treino Full Body</strong><span>App de acompanhamento do programa de 4 dias por semana (instalável).</span></a>
    <a href="fracoes/"><strong>Explorador de Frações — 6º ano</strong><span>Ferramenta interativa de frações.</span></a>
  </main>
</body>
</html>
